openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: AutoProfit organization-aware identity and catalog API.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: organization
  - name: catalog
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      security: []
      summary: Check API and database health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: Database unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
  /v1/health:
    get:
      operationId: getV1Health
      tags: [health]
      security: []
      summary: Backwards-compatible health redirect
      responses:
        "302": { description: Redirects to /health }
  /v1/auth/signup:
    post:
      operationId: signup
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: Account and organization created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { refresh_token: { type: string } }
      responses:
        "200":
          description: Rotated access token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoutResponse" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
  /v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, minLength: 40, maxLength: 200 }
                password: { $ref: "#/components/schemas/Password" }
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /v1/auth/password/change:
    post:
      operationId: changePassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { $ref: "#/components/schemas/Password" }
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
  /v1/me:
    get:
      operationId: getCurrentUser
      tags: [organization]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
  /v1/organizations:
    get:
      operationId: listOrganizations
      tags: [organization]
      responses:
        "200":
          description: Organizations visible to the user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/organizations/current:
    patch:
      operationId: updateCurrentOrganization
      tags: [organization]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 160 }
                business_type: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/organizations/members:
    get:
      operationId: listOrganizationMembers
      tags: [organization]
      responses:
        "200":
          description: Organization members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/organizations/members/{userId}:
    patch:
      operationId: updateOrganizationMember
      tags: [organization]
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [Owner, Admin, Manager, Staff, Viewer] }
                status: { type: string, enum: [active, suspended] }
                permissions_override: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/sessions/{sessionId}/revoke:
    post:
      operationId: revokeSession
      tags: [auth]
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/consents:
    get:
      operationId: listConsents
      tags: [auth]
      responses:
        "200":
          description: Current consent records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/consents/{policyType}:
    post:
      operationId: updateConsent
      tags: [auth]
      parameters:
        - name: policyType
          in: path
          required: true
          schema: { type: string, enum: [terms_of_service, privacy_policy, optional_processing] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties: { action: { type: string, enum: [grant, withdraw] } }
      responses:
        "200":
          description: Consent updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/catalog/references/{type}:
    get:
      operationId: listCatalogReferences
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/ReferenceType" }
      responses:
        "200":
          description: Reference values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
    post:
      operationId: createCatalogReference
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/ReferenceType" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceRequest" }
      responses:
        "201":
          description: Reference created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/catalog/references/{type}/{id}:
    patch:
      operationId: updateCatalogReference
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/ReferenceType" }
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceRequest" }
      responses:
        "200":
          description: Reference updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/catalog/references/{type}/{id}/archive:
    post:
      operationId: archiveCatalogReference
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/ReferenceType" }
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveRequest" }
      responses:
        "200":
          description: Reference archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/products:
    get:
      operationId: listProducts
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/IncludeArchived" }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
    post:
      operationId: createProduct
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductRequest" }
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/products/{productId}:
    get:
      operationId: getProduct
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/ProductId" }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
    patch:
      operationId: updateProduct
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/ProductId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductRequest" }
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/products/{productId}/archive:
    post:
      operationId: archiveProduct
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/ProductId" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveRequest" }
      responses:
        "200":
          description: Product archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/products/{productId}/variants:
    get:
      operationId: listVariants
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/ProductId" }
        - { $ref: "#/components/parameters/IncludeArchived" }
      responses:
        "200":
          description: Product variants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
    post:
      operationId: createVariant
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/ProductId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariantRequest" }
      responses:
        "201":
          description: Variant created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/variants/{variantId}:
    patch:
      operationId: updateVariant
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/VariantId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariantRequest" }
      responses:
        "200":
          description: Variant updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/variants/{variantId}/archive:
    post:
      operationId: archiveVariant
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/VariantId" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveRequest" }
      responses:
        "200":
          description: Variant archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/channels:
    get:
      operationId: listChannels
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/IncludeArchived" }
      responses:
        "200":
          description: Sales channels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
    post:
      operationId: createChannel
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelRequest" }
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/variants/{variantId}/listings:
    get:
      operationId: listVariantListings
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/VariantId" }
        - { $ref: "#/components/parameters/IncludeArchived" }
      responses:
        "200":
          description: Variant listings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
    post:
      operationId: createListing
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/VariantId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingRequest" }
      responses:
        "201":
          description: Listing created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/listings/{listingId}:
    patch:
      operationId: updateListing
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/ListingId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingRequest" }
      responses:
        "200":
          description: Listing updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/listings/{listingId}/archive:
    post:
      operationId: archiveListing
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/ListingId" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveRequest" }
      responses:
        "200":
          description: Listing archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/catalog/search:
    get:
      operationId: searchCatalog
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/IncludeArchived" }
      responses:
        "200":
          description: Catalog search results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/catalog/saved-queries:
    get:
      operationId: listSavedQueries
      tags: [catalog]
      responses:
        "200":
          description: Saved catalog queries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
    post:
      operationId: createSavedQuery
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                filters: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Saved query created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/catalog/saved-queries/{queryId}:
    delete:
      operationId: deleteSavedQuery
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/QueryId" }
      responses:
        "200":
          description: Saved query deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
  /v1/catalog/bulk/preview:
    post:
      operationId: previewCatalogBulk
      tags: [catalog]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity, rows]
              properties:
                entity: { type: string, enum: [products, variants] }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Bulk operation preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VariantId:
      name: variantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ListingId:
      name: listingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QueryId:
      name: queryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReferenceType:
      name: type
      in: path
      required: true
      schema: { type: string, enum: [categories, brands, tax-classes] }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 500 }
    IncludeArchived:
      name: include_archived
      in: query
      schema: { type: boolean, default: false }
    Search:
      name: q
      in: query
      schema: { type: string, maxLength: 200 }
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UnauthorizedError:
      description: Authentication required or invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ConflictError:
      description: Resource conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    Password:
      type: string
      minLength: 12
      maxLength: 128
      description: At least one lowercase, uppercase, and number.
    SignupRequest:
      type: object
      required: [name, email, password, organizationName, termsAccepted, privacyAccepted]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email, maxLength: 320 }
        password: { $ref: "#/components/schemas/Password" }
        organizationName: { type: string, minLength: 2, maxLength: 160 }
        businessType: { type: string, maxLength: 120 }
        termsAccepted: { type: boolean, const: true }
        privacyAccepted: { type: boolean, const: true }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
        deviceName: { type: string, minLength: 1, maxLength: 120 }
        organizationId: { type: string, format: uuid }
    AuthData:
      type: object
      required: [access_token, organization_id, role, session_id]
      properties:
        access_token: { type: string }
        organization_id: { type: string, format: uuid }
        role: { type: string }
        session_id: { type: string, format: uuid }
    AuthResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/AuthData" }
        meta: { $ref: "#/components/schemas/Meta" }
    SignupResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          allOf:
            - $ref: "#/components/schemas/AuthData"
            - type: object
              properties:
                user: { $ref: "#/components/schemas/User" }
                refresh_token: { type: string }
        meta: { $ref: "#/components/schemas/Meta" }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
      required: [id, email, name]
    Meta:
      type: object
      properties:
        request_id: { type: string }
        next_cursor: { type: string, nullable: true }
      required: [request_id]
    DataResponse:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: "#/components/schemas/Meta" }
    HealthResponse:
      type: object
      required: [status, service, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string }
        database:
          type: object
          required: [ok, latencyMs]
          properties:
            ok: { type: boolean }
            latencyMs: { type: integer }
            error: { type: string }
    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
        meta: { $ref: "#/components/schemas/Meta" }
    LogoutResponse:
      allOf:
        - $ref: "#/components/schemas/DataResponse"
    AcceptedResponse:
      allOf:
        - $ref: "#/components/schemas/DataResponse"
    ResetResponse:
      allOf:
        - $ref: "#/components/schemas/DataResponse"
    ReferenceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000, nullable: true }
        code: { type: string, maxLength: 40 }
        rate: { type: number, minimum: 0, maximum: 100 }
    ProductRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 2000, nullable: true }
        category_id: { type: string, format: uuid, nullable: true }
        brand_id: { type: string, format: uuid, nullable: true }
        tax_class_id: { type: string, format: uuid, nullable: true }
    VariantRequest:
      type: object
      required: [sku]
      properties:
        sku: { type: string, minLength: 1, maxLength: 100 }
        barcode: { type: string, maxLength: 80, nullable: true }
        attributes: { type: object, additionalProperties: true }
        cost_method: { type: string, enum: [FIFO, AVERAGE, STANDARD] }
        standard_cost: { type: number, minimum: 0, nullable: true }
    ChannelRequest:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
